name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Generate version info
      run: python generate_version_info.py

    - name: Build with PyInstaller
      run: python -m PyInstaller PlexDiscordRPC.spec --clean

    - name: Verify build
      run: |
        if (Test-Path "dist\PlexDiscordRPC-v*.exe") {
          Write-Host "Build successful!"
          Get-Item dist\PlexDiscordRPC-v*.exe | ForEach-Object {
            Write-Host "File: $($_.Name)"
            Write-Host "Size: $([math]::Round($_.Length/1MB, 2)) MB"
          }
        } else {
          Write-Error "Build failed - executable not found"
          exit 1
        }

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: PlexDiscordRPC-Windows-CI
        path: dist/PlexDiscordRPC-v*.exe
        retention-days: 7
