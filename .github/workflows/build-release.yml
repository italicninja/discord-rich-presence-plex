name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v2.12.0
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write  # Required for creating releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Generate version info
      run: python generate_version_info.py

    - name: Build with PyInstaller
      run: python -m PyInstaller PlexDiscordRPC.spec --clean

    - name: Get version from constants
      id: get_version
      run: |
        python -c "import sys; sys.path.insert(0, '.'); from config.constants import version; print(f'version={version}')" >> $env:GITHUB_OUTPUT

    - name: List dist directory
      run: dir dist

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PlexDiscordRPC-Windows
        path: dist/PlexDiscordRPC-v*.exe
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/PlexDiscordRPC-v*.exe
        body: |
          ## Discord Rich Presence for Plex - Windows Release

          ### Installation
          1. Download `PlexDiscordRPC-v${{ steps.get_version.outputs.version }}.exe`
          2. Run the executable (no installation required)
          3. Look for the icon in your system tray (bottom-right corner)
          4. Right-click the icon for options

          ### Features
          - ✅ Standalone executable (no Python required)
          - ✅ System tray application with GUI settings window
          - ✅ Pause/Resume monitoring from tray menu
          - ✅ Quick access to config file, log file, and data folder
          - ✅ Automatic Plex authentication (browser opens on first run)
          - ✅ Discord Rich Presence integration

          ### First Run
          On first run:
          1. Your browser will open for Plex authentication
          2. After signing in, edit `config.yaml` to set your Plex server name
             - Right-click tray icon → **Open Data Folder** or **Settings...**
          3. Restart the application

          ### Data Storage
          Config, cache, and logs are stored in `%APPDATA%\PlexDiscordRPC` and persist across updates.
          - Quick access: right-click tray icon → **Open Data Folder**

          ### Requirements
          - Windows 10/11
          - Discord desktop client running on the same machine
          - Plex Media Server access

          **Note:** The executable may take a few seconds to start on first launch.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
